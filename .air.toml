root = "."
testdata_dir = "testdata"
tmp_dir = "backend/tmp"

[build]
entrypoint = ["sh", "-c", "killall orbitmesh ; exec backend/tmp/orbitmesh"]
cmd = "go build -o backend/tmp/orbitmesh ./backend/cmd/orbitmesh"
delay = 500
exclude_dir = [
  "assets",
  "tmp",
  "vendor",
  "testdata",
  "frontend",
  "docs",
  ".git",
]
exclude_file = []
exclude_regex = ["_test.go"]
exclude_unchanged = false
follow_symlink = false
include_dir = []
include_ext = ["go", "tpl", "tmpl", "html"]
include_file = []
kill_delay = "15m"
log = "backend/build-errors.log"
poll = false
poll_interval = 0
rerun = true
rerun_delay = 5000
send_interrupt = true
stop_on_error = false

[color]
app = ""
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[log]
main_only = false
time = false

[misc]
clean_on_exit = false

[screen]
clear_on_rebuild = false
keep_scroll = true
